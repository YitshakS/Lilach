<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מסלול הסדר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800;900&display=swap">
<style>
  :root { --navy:#012045; --ink:#1d2a44; --ink-title:#031a3e; --accent:#1f5fbf; --card:#f2f8fc; --border:#c3cfe0; --muted:#55637d; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#dfe8f2; font-family:'Heebo',Arial,sans-serif; }
  .slide { width:1280px; height:720px; margin:20px auto; background:#012045; position:relative; overflow:hidden; color:#eaf3fc; }
  .text { position:absolute; right:70px; top:34px; width:1140px; }
  h1 { margin:0 0 16px; font-size:70px; white-space:nowrap; color:#fff; font-weight:900; line-height:1; text-shadow:0 2px 12px rgba(0,16,40,.7); }
  .sub { margin:14px 0 22px; font-size:34px; font-weight:800; color:var(--accent); }
  ul { margin:0; padding:0; list-style:none; font-size:30px; line-height:1.5; font-weight:500; }
  li { padding-right:26px; position:relative; margin-bottom:3px; }
  li b { font-weight:900; color:#8fc4f2; }
  .red { color:#ffd84a; font-weight:900; }
  li::before { content:""; position:absolute; right:0; top:.62em; width:11px; height:11px; border-radius:50%; background:var(--accent); }
  .mh { position:absolute; left:70px; top:440px; width:150px; display:block; }
  .page { position:absolute; left:70px; top:520px; width:300px; height:187px; }
  .zoom { position:absolute; left:430px; top:470px; width:520px; height:170px; }
  .hm { position:absolute; right:70px; bottom:20px; width:240px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .hm .mast { width:240px; display:block; }
  .hm .art { width:155px; display:block; }
  .arrow { position:absolute; left:300px; top:541px; width:138px; transform:scaleX(-1); display:block; }
  .photo { position:absolute; left:0; right:0; bottom:0; height:340px; background:url(assets/share/background-bottom.jpg) center bottom / 1280px auto no-repeat; opacity:.4; filter:brightness(1.0); -webkit-mask-image:linear-gradient(to top, #000 60%, transparent 100%); mask-image:linear-gradient(to top, #000 60%, transparent 100%); }
  ul { text-shadow:0 2px 10px rgba(0,16,40,.7); }
  svg { display:block; width:100%; height:100%; overflow:visible; }
</style>
<link rel="stylesheet" href="nav.css">
</head>
<body>
<section class="slide">
  <div class="photo"></div>
  <div class="text">
    <h1>מסלול הסדר</h1>
    <ul>
      <li><b>התחלה:</b> קיץ 1959</li>
      <li><b>מתנגדים:</b> בג"ץ שביטל את חוק טל בפברואר 2012</li>
      <li><b>כמות התחלה:</b> רק 1 ישיבה (כרם ביבנה), רק 3 תלמידים</li>
      <li><b>כמות כיום:</b> כ 80 ישיבות הסדר, כ 12,000 <span class="red">חיילים</span></li>
      <li><b>יחידה:</b> <span class="red">קרבי</span></li>
      <li><b>גורם מאשר:</b> שר הביטחון שמעון פרס, באוקטובר 1974</li>
    </ul>
  </div>

  <img class="mh" src="assets/hatzofe_masthead_light.png" alt="הצופה 12.9.1969">

  <!-- the whole original article, small, with the marker on the sentence -->
  <div class="page">
    <svg viewBox="0 0 1696 1056" preserveAspectRatio="xMidYMid meet">
      <image href="assets/hatzofe_1969-09-12_article_v2_light.png" width="1696" height="1056"/>
      <image href="assets/marker.png" x="925" y="608" width="370" height="120" preserveAspectRatio="none"/>
    </svg>
  </div>

  <div class="zoom">
    <svg viewBox="915 604 390 128" preserveAspectRatio="xMidYMid meet">
      <defs><clipPath id="sent"><rect x="960" y="636" width="300" height="61"/></clipPath></defs>
      <image clip-path="url(#sent)" href="assets/hatzofe_1969-09-12_article_v2_light.png" width="1696" height="1056"/>
      <image href="assets/marker.png" x="925" y="608" width="370" height="120" preserveAspectRatio="none"/>
    </svg>
  </div>

  <img class="arrow" src="assets/arrow.png" alt="">

  <!-- Al HaMishmar, 6.10.1974: masthead + the article about the Peres meeting -->
  <div class="hm">
    <img class="mast" src="assets/almishmar_masthead_light.png" alt="על המשמר 6.10.1974">
    <img class="art" src="assets/almishmar_article_light.png" alt="סוכם מסלול השרות של בני ישיבות ההסדר">
  </div>
</section>
<script>
  function fit() {
    const s = Math.min(window.innerWidth / 1300, window.innerHeight / 760);
    const el = document.querySelector('.slide');
    el.style.transformOrigin = 'top left';
    el.style.transform = 'scale(' + s + ')';
    el.style.margin = '0';
    el.style.position = 'absolute';
    el.style.left = Math.max(0, (window.innerWidth - 1280 * s) / 2) + 'px';
    el.style.top = Math.max(0, (window.innerHeight - 720 * s) / 2) + 'px';
    document.body.style.overflow = 'hidden';
  }
  fit(); window.addEventListener('resize', fit);
</script>
<script src="nav.js"></script>
</body>
</html>
