<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>העצומה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800;900&display=swap">
<style>
  :root { --navy:#012045; --ink:#1d2a44; --ink-title:#031a3e; --accent:#1f5fbf; --card:#f2f8fc; --border:#c3cfe0; --muted:#55637d; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#dfe8f2; font-family:'Heebo',Arial,sans-serif; }
  .slide { width:1280px; height:720px; margin:20px auto; background:#012045; position:relative; overflow:hidden; color:#eaf3fc; }
  .text { position:absolute; right:60px; top:50px; width:1160px; }
  h1 { margin:0 0 26px; font-size:50px; white-space:nowrap; color:#fff; font-weight:900; line-height:1; text-shadow:0 2px 12px rgba(0,16,40,.7); }
  .sub { margin:14px 0 22px; font-size:34px; font-weight:800; color:var(--accent); }
  ul { margin:0; padding:0; list-style:none; font-size:30px; line-height:1.5; font-weight:500; }
  li { padding-right:26px; position:relative; margin-bottom:6px; }
  li b { font-weight:900; color:var(--ink-title); }
  .red { color:#e8112d; font-weight:900; }
  li::before { content:""; position:absolute; right:0; top:.62em; width:11px; height:11px; border-radius:50%; background:var(--accent); }
  .photo { position:absolute; left:0; right:0; bottom:0; height:215px; background:url(assets/share/background-bottom.jpg) center bottom / 1280px auto no-repeat; opacity:.4; -webkit-mask-image:linear-gradient(to top, #000 60%, transparent 100%); mask-image:linear-gradient(to top, #000 60%, transparent 100%); }
  svg { display:block; width:100%; height:100%; overflow:visible; }
  .gap { color:#b3261e; font-weight:700; }
  .sheet { position:absolute; left:40px; top:150px; width:1200px; display:block; padding:12px; background:rgba(250,252,255,.93); border-radius:16px; box-shadow:0 8px 28px rgba(0,10,30,.45); }
  .shot { position:absolute; left:50%; top:20px; height:680px; transform:translateX(-50%); display:block; border-radius:14px; box-shadow:0 10px 34px rgba(0,10,30,.6); }
</style>
<link rel="stylesheet" href="nav.css">
</head>
<body>
<section class="slide">
  <div class="photo"></div>
  <img class="shot" src="assets/petition_page.png" alt="דף העצומה">
</section>
<script>
  function fit() {
    const s = Math.min(window.innerWidth / 1300, window.innerHeight / 760);
    const el = document.querySelector('.slide');
    el.style.transformOrigin = 'top left';
    el.style.transform = 'scale(' + s + ')';
    el.style.margin = '0';
    el.style.position = 'absolute';
    el.style.left = Math.max(0, (window.innerWidth - 1280 * s) / 2) + 'px';
    el.style.top = Math.max(0, (window.innerHeight - 720 * s) / 2) + 'px';
    document.body.style.overflow = 'hidden';
  }
  fit(); window.addEventListener('resize', fit);
</script>
<script src="nav.js"></script>
</body>
</html>
